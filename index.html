<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>佐渡島マップ</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
    #map {
        height: 600px;
        width: 100%;
    }

    .emoji-marker {
        font-size: 30px;
        text-align: center;
        line-height: 40px;
        background: none;
        border: none;
    }

    /* 編集モードのボタン */
    #controls {
        margin: 10px 0;
    }

    #editModeButton {
        padding: 10px 16px;
        font-size: 16px;
        cursor: pointer;
    }

    #modeText {
        margin-left: 10px;
        font-weight: bold;
    }

    #formButtons {
        margin-top: 15px;
        text-align: right;
    }

    #formButtons button {
        padding: 8px 14px;
        margin-left: 5px;

        cursor: pointer;
    }

        #authArea {
    margin: 10px 0;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 8px;
}

#authArea button {
    padding: 8px 14px;
    margin-right: 8px;
    cursor: pointer;
}

#userInfo {
    font-size: 14px;
}
    
</style>
    
</head>

<body>

   <h1>佐渡島マップ</h1>


    <div id="authArea">
    <button id="loginButton">🔑 Googleでログイン</button>
    <button id="logoutButton" style="display:none;">ログアウト</button>
    <span id="userInfo"></span>
</div>
    
<div id="controls" style="display:none;">
    <button id="editModeButton">✏️ 編集モード</button>
    <span id="modeText">現在：閲覧モード</span>
</div>

<div id="map"></div>

    <!-- =========================================
     スポット追加フォーム
     ========================================= -->

<div id="spotForm">

    <h2>📍 スポットを追加</h2>

    <label for="spotName">
        スポット名
    </label>

    <input
        type="text"
        id="spotName"
        placeholder="例：REC活動場所①"
    >


    <label for="spotCategory">
        カテゴリー
    </label>

    <select id="spotCategory">

        <option value="活動場所">
            活動場所
        </option>

        <option value="宿泊地">
            宿泊地
        </option>

        <option value="観光地">
            観光地
        </option>

        <option value="飲食店">
            飲食店
        </option>

        <option value="生活用品店">
            スーパーや生活用品店
        </option>

    </select>


    <label for="spotSubcategory">
        詳細カテゴリー
    </label>

    <input
        type="text"
        id="spotSubcategory"
        placeholder="例：自然風景、博物館など"
    >


    <label for="spotAddress">
        住所
    </label>

    <input
        type="text"
        id="spotAddress"
        placeholder="例：佐渡市〇〇地区"
    >


    <label for="spotActivity">
        活動内容・利用内容
    </label>

    <textarea
        id="spotActivity"
        placeholder="例：棚田の整備、農作業"
    ></textarea>


    <label for="spotNote">
        メモ
    </label>

    <textarea
        id="spotNote"
        placeholder="自由にメモを入力"
    ></textarea>


    <div id="formButtons">

        <button
            type="button"
            id="cancelButton"
        >
            キャンセル
        </button>

        <button
            type="button"
            id="saveButton"
        >
            保存
        </button>

    </div>

</div>

    

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =========================================
        // Supabaseの設定
        // =========================================

        const SUPABASE_URL = "https://cskyusrujmxhczcgkdke.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_T-lOBrjyPzfkPUI8mLbHVA_FIRyAp5X";

      　 const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY

        );


        // =========================================
        // Leafletの地図を作成
        // =========================================

        const map = L.map('map').setView([38.0, 138.4], 10);


        // OpenStreetMap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =========================================
        // カテゴリーごとのレイヤー
        // =========================================

        const layers = {
            "活動場所": L.layerGroup(),
            "宿泊地": L.layerGroup(),
            "観光地": L.layerGroup(),
            "飲食店": L.layerGroup(),
            "生活用品店": L.layerGroup()
        };


// =========================================
// マーカーのアイコン
// =========================================

const icons = {

    "活動場所": L.divIcon({
        html: "🌾",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "宿泊地": L.divIcon({
        html: "🏠",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "観光地": L.divIcon({
        html: "📍",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "飲食店": L.divIcon({
        html: "🍴",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "生活用品店": L.divIcon({
        html: "🛒",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    })
};


// カテゴリーが見つからない場合に使う予備アイコン
const defaultIcon = L.divIcon({
    html: "📍",
    className: "emoji-marker",
    iconSize: [40, 40],
    iconAnchor: [20, 20]
});


      

        // =========================================
        // Supabaseからスポットを取得
        // =========================================

        async function loadPlaces() {

            const { data, error } = await supabaseClient
                .from('spots')
                .select('*');


            // エラーが発生した場合
            if (error) {

                console.error("Supabaseエラー:", error);

                alert(
                    "スポット情報を取得できませんでした。\n" +
                    error.message
                );

                return;
            }


            console.log("Supabaseから取得したデータ:", data);


            // =====================================
            // 取得したスポットを地図に表示
            // =====================================

            data.forEach(function(place) {

                // マーカーのアイコンを取得
const icon = icons[place.category];

// マーカーを作成
const marker = L.marker(
    [place.lat, place.lng],
    {
        icon: icons[place.category] || defaultIcon
    }
);


                // ポップアップ
                marker.bindPopup(`

                    <div style="width:260px;">

                        <h2>${place.name}</h2>

                        <p>
                            <strong>カテゴリー：</strong>
                            ${place.category}
                        </p>

                        ${
                            place.subcategory
                            ?
                            `<p>
                                <strong>分類：</strong>
                                ${place.subcategory}
                            </p>`
                            :
                            ""
                        }

                        <hr>

                        <p>
                            <strong>📍 所在地</strong><br>
                            ${place.address}
                        </p>

                        <p>
                            <strong>🌾 活動内容</strong><br>
                            ${place.activity_history}
                        </p>

                        <p>
                            <strong>📝 メモ</strong><br>
                            ${place.note}
                        </p>

                        <hr>

                        <p>
                            ${place.description}
                        </p>

                    </div>

                `);


                // カテゴリーに対応するレイヤーへ追加
                if (layers[place.category]) {

                    marker.addTo(
                        layers[place.category]
                    );

                } else {

                    // 未登録カテゴリーの場合
                    marker.addTo(map);

                }

            });


            // =====================================
            // レイヤーを地図に追加
            // =====================================

            Object.values(layers).forEach(
                function(layer) {
                    layer.addTo(map);
                }
            );


            // =====================================
            // レイヤー切り替え
            // =====================================

            const overlayMaps = {

                "🌾 活動場所":
                    layers["活動場所"],

                "🏠 宿泊地":
                    layers["宿泊地"],

                "📍 観光地":
                    layers["観光地"],

                "🍴 飲食店":
                    layers["飲食店"],

                "🛒 生活用品店":
                    layers["生活用品店"]

            };


            L.control.layers(
                null,
                overlayMaps
            ).addTo(map);

        }



    // =========================================
    // Supabaseからデータを読み込む
    // =========================================

loadPlaces();


// =========================================
// 編集モード
// =========================================

let editMode = false;

const editModeButton =
    document.getElementById("editModeButton");

const modeText =
    document.getElementById("modeText");


editModeButton.addEventListener("click", function() {

    // 編集モードと閲覧モードを切り替える
    editMode = !editMode;

    if (editMode) {

        editModeButton.textContent =
            "👀 閲覧モードに戻す";

        modeText.textContent =
            "現在：編集モード";

    } else {

        editModeButton.textContent =
            "✏️ 編集モード";

        modeText.textContent =
            "現在：閲覧モード";
    }

});


// =========================================
// 編集モードで地図をクリック
// =========================================

// =========================================
// スポット追加用の変数
// =========================================

let newSpotLat = null;
let newSpotLng = null;

let temporaryMarker = null;


// =========================================
// 地図をクリック
// =========================================

map.on("click", function(e) {

    // 閲覧モードなら何もしない
    if (!editMode) {
        return;
    }


    // クリックした場所の座標
    newSpotLat = e.latlng.lat;
    newSpotLng = e.latlng.lng;


    console.log(
        "新しいスポットの場所:",
        newSpotLat,
        newSpotLng
    );


    // =====================================
    // 仮マーカーを表示
    // =====================================

    // すでに仮マーカーがあれば削除
    if (temporaryMarker) {
        map.removeLayer(temporaryMarker);
    }


    // 新しい仮マーカー
    temporaryMarker = L.marker(
        [newSpotLat, newSpotLng]
    ).addTo(map);


    temporaryMarker.bindPopup(
        "ここにスポットを追加します"
    ).openPopup();


    // =====================================
    // 入力フォームを表示
    // =====================================

    document.getElementById(
        "spotForm"
    ).style.display = "block";

});

 // =========================================
// キャンセルボタン
// =========================================

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        // フォームを閉じる
        document.getElementById(
            "spotForm"
        ).style.display = "none";


        // 仮マーカーを削除
        if (temporaryMarker) {

            map.removeLayer(
                temporaryMarker
            );

            temporaryMarker = null;
        }


        // 座標をリセット
        newSpotLat = null;
        newSpotLng = null;

    }
);

    document.getElementById("saveButton").addEventListener("click", async function() {

    // フォームから入力内容を取得
    const name = document.getElementById("spotName").value;
    const category = document.getElementById("spotCategory").value;
    const subcategory = document.getElementById("spotSubcategory").value;
    const address = document.getElementById("spotAddress").value;
    const activity = document.getElementById("spotActivity").value;
    const note = document.getElementById("spotNote").value;

    // スポット名が空の場合
    if (!name) {
        alert("スポット名を入力してください");
        return;
    }

    // 場所が選択されていない場合
    if (newSpotLat === null || newSpotLng === null) {
        alert("地図上の場所を選択してください");
        return;
    }

    // Supabaseにデータを登録
    const { data, error } = await supabaseClient
        .from("spots")
        .insert([
            {
                name: name,
                lat: newSpotLat,
                lng: newSpotLng,
                category: category,
                subcategory: subcategory,
                address: address,
                activity_history: activity,
                note: note
            }
        ])
        .select();

    // エラーが発生した場合
    if (error) {
        console.error("保存エラー:", error);
        alert("保存に失敗しました。\n" + error.message);
        return;
    }

    console.log("保存されたデータ:", data);

    alert("スポットを保存しました！");

    // フォームを閉じる
    document.getElementById("spotForm").style.display = "none";

    // 仮マーカーを削除
    if (temporaryMarker) {
        map.removeLayer(temporaryMarker);
        temporaryMarker = null;
    }

    // 座標をリセット
    newSpotLat = null;
    newSpotLng = null;

    // 入力フォームを空にする
    document.getElementById("spotName").value = "";
    document.getElementById("spotSubcategory").value = "";
    document.getElementById("spotAddress").value = "";
    document.getElementById("spotActivity").value = "";
    document.getElementById("spotNote").value = "";

    // ページを再読み込みして新しいスポットを表示
    location.reload();
});    


 // ==============================
// Googleログイン
// ==============================

const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const userInfo = document.getElementById("userInfo");

// Googleログイン
loginButton.addEventListener("click", async function() {

    const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
            redirectTo: "https://ytrnht1222-cmd.github.io/sado_map/"
        }
    });

    if (error) {
        console.error("ログインエラー:", error);
        alert("ログインに失敗しました。\n" + error.message);
    }
});

// ログアウト
logoutButton.addEventListener("click", async function() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        console.error("ログアウトエラー:", error);
        return;
    }

    location.reload();
});

// 現在ログインしているユーザーを確認
async function checkLogin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

        // ==========================
        // Googleログイン済み
        // ==========================

        loginButton.style.display = "none";
        logoutButton.style.display = "inline-block";

        userInfo.textContent =
            "ログイン中：" + session.user.email;

        console.log("ログインユーザー:", session.user);

        // --------------------------
        // RECメンバーか確認
        // --------------------------

        const { data: isMember, error } =
            await supabaseClient.rpc("is_rec_member");

        console.log("RECメンバー判定:", isMember);
        console.log("判定エラー:", error);

        if (error) {
            console.error("メンバー確認エラー:", error);
            alert("メンバー確認に失敗しました");
            return;
        }

       if (isMember) {

    console.log("RECメンバーです！");

    // 編集機能を表示
    document.getElementById("controls").style.display = "block";

} else {

    console.log("RECメンバーではありません");

    // 編集機能を非表示
    document.getElementById("controls").style.display = "none";
}
    } } else {

    loginButton.style.display = "inline-block";
    logoutButton.style.display = "none";

    userInfo.textContent = "";

    // 編集機能を非表示
    document.getElementById("controls").style.display = "none";

    console.log("現在ログインしていません");
}
}

checkLogin();

    

</script>
        
</body>
</html>
