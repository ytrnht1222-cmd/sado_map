<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佐渡島マップ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        #map {
            height: 600px;
            width: 100%;
            position: relative;
        }

        /* 地図を全画面表示したときのサイズ */
        #map:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        #map:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }

        /* 全画面ボタン */
        .fullscreen-control {
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .fullscreen-control button {
            display: block;
            width: 36px;
            height: 36px;
            border: 0;
            background: white;
            cursor: pointer;
            font-size: 20px;
            line-height: 36px;
            padding: 0;
        }

        .fullscreen-control button:hover {
            background: #f4f4f4;
        }

        .emoji-marker {
            font-size: 30px;
            text-align: center;
            line-height: 40px;
            background: none;
            border: none;
        }

        #authArea,
        #adminPanel {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
        }

        #authArea {
            background: #f5f5f5;
        }

        #adminPanel {
            display: none;
            background: #fff7e6;
            border: 1px solid #f0c36d;
        }

        #authArea button,
        #adminPanel button,
        #controls button,
        #categoryFilters button,
        #formButtons button,
        #editFormButtons button {
            padding: 8px 12px;
            margin-right: 6px;
            cursor: pointer;
        }

        #userInfo,
        #roleInfo {
            margin-left: 6px;
            font-size: 14px;
        }

        #memberForm {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #newMemberEmail {
            padding: 8px;
            width: 300px;
            max-width: 100%;
            box-sizing: border-box;
        }

        #memberList {
            margin-top: 14px;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .member-email {
            flex: 1;
            word-break: break-all;
        }

        .member-role {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }

        #modeText {
            font-weight: bold;
        }

        #categoryFilters {
            margin: 10px 0;
        }

        #spotForm,
        #editSpotForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            max-width: 92vw;
            max-height: 88vh;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            box-sizing: border-box;
        }

        #spotForm label,
        #editSpotForm label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        #spotForm input,
        #spotForm select,
        #spotForm textarea,
        #editSpotForm input,
        #editSpotForm select,
        #editSpotForm textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
        }

        #spotForm textarea,
        #editSpotForm textarea {
            min-height: 80px;
            resize: vertical;
        }

        .photo-help {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        #formButtons,
        #editFormButtons {
            margin-top: 15px;
            text-align: right;
        }

        .spot-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin: 8px 0 12px;
        }

        .spot-gallery-item {
            min-width: 0;
        }

        .spot-gallery img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            background: #eee;
        }

        .photo-preview {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .photo-preview-item {
            position: relative;
        }

        .photo-preview-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .photo-preview-item button {
            position: absolute;
            top: 4px;
            right: 4px;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            background: rgba(0,0,0,0.65);
            color: white;
            line-height: 20px;
            padding: 0;
        }

        .existing-photo-item {
            position: relative;
        }

        .existing-photo-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .existing-photo-item button {
            position: absolute;
            top: 4px;
            right: 4px;
        }

        .small-note {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>佐渡島マップ</h1>

    <!-- Googleログイン -->
    <div id="authArea">
        <button id="loginButton" type="button">🔑 Googleでログイン</button>
        <button id="logoutButton" type="button" style="display:none;">ログアウト</button>
        <span id="userInfo"></span>
        <span id="roleInfo"></span>
    </div>

    <!-- REC管理者だけ表示 -->
    <div id="adminPanel">
        <h3>👑 RECメンバー管理</h3>

        <div id="memberForm">
            <span>Googleアカウントのメールアドレス：</span>
            <input
                type="email"
                id="newMemberEmail"
                placeholder="example@gmail.com"
            >
            <button id="addMemberButton" type="button">➕ メンバーを許可</button>
            <button id="reloadMembersButton" type="button">🔄 更新</button>
        </div>

        <div class="small-note" style="margin-top:6px;">
            ※相手がGoogleログインに使うメールアドレスと同じものを入力してください。
        </div>

        <div id="memberList"></div>
    </div>

    <!-- RECメンバーだけ表示 -->
    <div id="controls" style="display:none; margin:10px 0;">
        <button id="editModeButton" type="button">✏️ 編集モード</button>
        <span id="modeText">現在：閲覧モード</span>
    </div>

    <!-- カテゴリー絞り込み -->
    <div id="categoryFilters">
        <strong>表示：</strong>
        <button type="button" onclick="showAllLayers()">すべて</button>
        <button type="button" onclick="showCategory('活動場所')">🌾 活動場所</button>
        <button type="button" onclick="showCategory('宿泊地')">🏠 宿泊地</button>
        <button type="button" onclick="showCategory('観光地')">📍 観光地</button>
        <button type="button" onclick="showCategory('飲食店')">🍴 飲食店</button>
        <button type="button" onclick="showCategory('生活用品店')">🛒 生活用品店</button>
    </div>

    <div id="map"></div>

    <!-- スポット追加フォーム -->
    <div id="spotForm">
        <h2>📍 スポットを追加</h2>

        <label for="spotName">スポット名</label>
        <input type="text" id="spotName" placeholder="例：REC活動場所①">

        <label for="spotCategory">カテゴリー</label>
        <select id="spotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">生活用品店</option>
        </select>

        <label for="spotSubcategory">詳細カテゴリー</label>
        <input type="text" id="spotSubcategory" placeholder="例：自然風景、博物館など">

        <label for="spotAddress">住所</label>
        <input type="text" id="spotAddress" placeholder="例：佐渡市〇〇地区">

        <label for="spotActivity">活動内容・利用内容</label>
        <textarea id="spotActivity" placeholder="例：棚田の整備、農作業"></textarea>

        <label for="spotNote">メモ</label>
        <textarea id="spotNote" placeholder="自由にメモを入力"></textarea>

        <label for="spotImages">写真（複数選択可能）</label>
        <input type="file" id="spotImages" accept="image/*" multiple>
        <div class="photo-help">JPG・PNGなど。1枚5MB以下。複数枚選択できます。</div>
        <div id="spotPhotoPreview" class="photo-preview"></div>

        <div id="formButtons">
            <button type="button" id="cancelButton">キャンセル</button>
            <button type="button" id="saveButton">保存</button>
        </div>
    </div>

    <!-- スポット編集フォーム -->
    <div id="editSpotForm">
        <h2>✏️ スポットを編集</h2>

        <label for="editSpotName">スポット名</label>
        <input type="text" id="editSpotName">

        <label for="editSpotCategory">カテゴリー</label>
        <select id="editSpotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">生活用品店</option>
        </select>

        <label for="editSpotSubcategory">詳細カテゴリー</label>
        <input type="text" id="editSpotSubcategory">

        <label for="editSpotAddress">住所</label>
        <input type="text" id="editSpotAddress">

        <label for="editSpotActivity">活動内容・利用内容</label>
        <textarea id="editSpotActivity"></textarea>

        <label for="editSpotNote">メモ</label>
        <textarea id="editSpotNote"></textarea>

        <label>現在の写真</label>
        <div id="existingEditPhotoPreview" class="photo-preview"></div>
        <div id="legacyEditPhotoPreview"></div>

        <label for="editSpotImages">写真を追加（複数選択可能）</label>
        <input type="file" id="editSpotImages" accept="image/*" multiple>
        <div class="photo-help">既存の写真はそのまま残り、新しく選んだ写真が追加されます。1枚5MB以下。</div>
        <div id="editPhotoPreview" class="photo-preview"></div>

        <div id="editFormButtons">
            <button type="button" id="editCancelButton">キャンセル</button>
            <button type="button" id="editSaveButton">保存</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // =========================================
        // Supabase
        // =========================================
        const SUPABASE_URL =
            "https://cskyusrujmxhczcgkdke.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_T-lOBrjyPzfkPUI8mLbHVA_FIRyAp5X";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        // =========================================
        // Leaflet地図
        // =========================================
        const map = L.map("map").setView([38.0, 138.4], 10);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        // =========================================
        // 地図の全画面表示
        // =========================================
        const FullscreenControl = L.Control.extend({
            options: {
                position: "topright"
            },

            onAdd: function() {
                const container = L.DomUtil.create(
                    "div",
                    "fullscreen-control leaflet-bar"
                );

                const button = L.DomUtil.create(
                    "button",
                    "fullscreen-button",
                    container
                );

                button.type = "button";
                button.textContent = "⛶";
                button.title = "地図を全画面表示";
                button.setAttribute(
                    "aria-label",
                    "地図を全画面表示"
                );

                // ボタン操作が地図のクリックやドラッグとして
                // 誤認識されないようにする
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                async function toggleFullscreen() {
                    const mapContainer = map.getContainer();

                    try {
                        const isFullscreen =
                            document.fullscreenElement === mapContainer ||
                            document.webkitFullscreenElement === mapContainer;

                        if (!isFullscreen) {
                            if (mapContainer.requestFullscreen) {
                                await mapContainer.requestFullscreen();
                            } else if (mapContainer.webkitRequestFullscreen) {
                                mapContainer.webkitRequestFullscreen();
                            } else {
                                alert("このブラウザでは全画面表示に対応していません。");
                                return;
                            }
                        } else {
                            if (document.exitFullscreen) {
                                await document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                        }
                    } catch (error) {
                        console.error("全画面表示エラー:", error);
                        alert("全画面表示を開始できませんでした。");
                    }
                }

                button.addEventListener("click", toggleFullscreen);

                function updateFullscreenButton() {
                    const mapContainer = map.getContainer();
                    const isFullscreen =
                        document.fullscreenElement === mapContainer ||
                        document.webkitFullscreenElement === mapContainer;

                    button.title = isFullscreen
                        ? "全画面表示を終了"
                        : "地図を全画面表示";

                    button.setAttribute(
                        "aria-label",
                        isFullscreen
                            ? "全画面表示を終了"
                            : "地図を全画面表示"
                    );

                    // 全画面切り替え後にLeafletの表示サイズを再計算
                    setTimeout(function() {
                        map.invalidateSize();
                    }, 100);
                }

                document.addEventListener(
                    "fullscreenchange",
                    updateFullscreenButton
                );

                document.addEventListener(
                    "webkitfullscreenchange",
                    updateFullscreenButton
                );

                return container;
            }
        });

        map.addControl(new FullscreenControl());

        // =========================================
        // カテゴリー
        // =========================================
        const layers = {
            "活動場所": L.layerGroup().addTo(map),
            "宿泊地": L.layerGroup().addTo(map),
            "観光地": L.layerGroup().addTo(map),
            "飲食店": L.layerGroup().addTo(map),
            "生活用品店": L.layerGroup().addTo(map)
        };

        const icons = {
            "活動場所": L.divIcon({
                html: "🌾",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "宿泊地": L.divIcon({
                html: "🏠",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "観光地": L.divIcon({
                html: "📍",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "飲食店": L.divIcon({
                html: "🍴",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "生活用品店": L.divIcon({
                html: "🛒",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            })
        };

        const defaultIcon = L.divIcon({
            html: "📍",
            className: "emoji-marker",
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        // =========================================
        // 状態
        // =========================================
        let editMode = false;
        let editingSpotId = null;
        let currentUserIsMember = false;
        let currentUserIsAdmin = false;
        let newSpotLat = null;
        let newSpotLng = null;
        let temporaryMarker = null;

        let selectedSpotImages.length = 0;
        let selectedEditImages.length = 0;
        let existingEditImages = [];
        let imagesToDelete = [];

        // =========================================
        // HTML要素
        // =========================================
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");
        const userInfo = document.getElementById("userInfo");
        const roleInfo = document.getElementById("roleInfo");
        const controls = document.getElementById("controls");
        const editModeButton = document.getElementById("editModeButton");
        const modeText = document.getElementById("modeText");
        const adminPanel = document.getElementById("adminPanel");
        const newMemberEmail = document.getElementById("newMemberEmail");
        const memberList = document.getElementById("memberList");

        // =========================================
        // 画面上のHTMLに安全に文字を入れるための関数
        // =========================================
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, "&#096;");
        }

        // =========================================
        // 写真プレビュー
        // =========================================
        function renderPhotoPreview(files, previewId, selectedArray) {
            const preview = document.getElementById(previewId);

            if (!preview) {
                console.error("写真プレビュー欄が見つかりません:", previewId);
                return;
            }

            preview.innerHTML = "";

            files.forEach(function(file, index) {
                const reader = new FileReader();

                reader.onload = function(event) {
                    const item = document.createElement("div");
                    item.className = "photo-preview-item";

                    const image = document.createElement("img");
                    image.src = event.target.result;
                    image.alt = "選択した写真";

                    const removeButton = document.createElement("button");
                    removeButton.type = "button";
                    removeButton.textContent = "×";
                    removeButton.title = "この写真を外す";

                    removeButton.addEventListener("click", function() {
                        selectedArray.splice(index, 1);
                        renderPhotoPreview(
                            selectedArray,
                            previewId,
                            selectedArray
                        );
                    });

                    item.appendChild(image);
                    item.appendChild(removeButton);
                    preview.appendChild(item);
                };

                reader.readAsDataURL(file);
            });
        }

        function handlePhotoSelection(inputId, previewId, selectedArray) {
            const input = document.getElementById(inputId);

            // 今回のエラー対策：HTML要素がない場合は処理を止める
            if (!input) {
                console.error("写真入力欄が見つかりません:", inputId);
                return;
            }

            input.addEventListener("change", function() {
                Array.from(input.files || []).forEach(function(file) {
                    if (!file.type.startsWith("image/")) {
                        alert(file.name + " は画像ファイルではありません。");
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        alert(file.name + " は5MBを超えています。");
                        return;
                    }

                    selectedArray.push(file);
                });

                input.value = "";

                renderPhotoPreview(
                    selectedArray,
                    previewId,
                    selectedArray
                );
            });
        }

        // 必ずHTML側に存在するIDを使用
        handlePhotoSelection(
            "spotImages",
            "spotPhotoPreview",
            selectedSpotImages
        );

        handlePhotoSelection(
            "editSpotImages",
            "editPhotoPreview",
            selectedEditImages
        );

        // =========================================
        // Storageへ複数写真をアップロード
        // =========================================
        async function uploadSpotImages(spotId, files) {
            const uploadedImages = [];

            for (const file of files) {
                const extension =
                    file.name.includes(".")
                        ? file.name.split(".").pop().toLowerCase()
                        : "jpg";

                const filePath =
                    spotId + "/" + crypto.randomUUID() + "." + extension;

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("spot-images")
                        .upload(filePath, file, {
                            cacheControl: "3600",
                            upsert: false
                        });

                if (uploadError) {
                    throw uploadError;
                }

                const { data: publicUrlData } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(filePath);

                const imageUrl = publicUrlData.publicUrl;

                const { data: imageRow, error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .insert({
                            spot_id: spotId,
                            image_url: imageUrl,
                            file_path: filePath
                        })
                        .select()
                        .single();

                if (dbError) {
                    // DB登録に失敗した場合は、今アップロードしたファイルを削除する
                    await supabaseClient.storage
                        .from("spot-images")
                        .remove([filePath]);

                    throw dbError;
                }

                uploadedImages.push(imageRow);
            }

            return uploadedImages;
        }

        // =========================================
        // 写真URLを確実に作る
        // =========================================
        function getPhotoUrl(image) {
            // file_pathがある場合はStorageからURLを作り直す
            // image_urlが古い・誤っている場合でも表示できるようにする
            if (image && image.file_path) {
                const { data } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(image.file_path);

                if (data && data.publicUrl) {
                    return data.publicUrl;
                }
            }

            return image && image.image_url
                ? image.image_url
                : "";
        }

        // =========================================
        // 写真一覧を取得
        // =========================================
        async function getSpotImages(spotId) {
            const { data, error } =
                await supabaseClient
                    .from("spot_images")
                    .select("id, spot_id, image_url, file_path, created_at")
                    .eq("spot_id", spotId)
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("写真取得エラー:", error);
                return [];
            }

            return (data || []).filter(function(image) {
                return !!getPhotoUrl(image);
            });
        }

        // =========================================
        // ポップアップ写真を作る
        // =========================================
        function buildGalleryHtml(images, spotName) {
            if (!images || images.length === 0) {
                return `
                    <div style="margin:8px 0 12px;">
                        <strong>📷 写真</strong><br>
                        <span style="font-size:13px;color:#777;">写真は登録されていません</span>
                    </div>
                `;
            }

            const galleryItems = images.map(function(image) {
                const photoUrl = getPhotoUrl(image);
                const safeUrl = escapeAttribute(photoUrl);
                const safeName = escapeAttribute(spotName || "スポット写真");

                return `
                    <div class="spot-gallery-item">
                        <img
                            src="${safeUrl}"
                            alt="${safeName}"
                            loading="lazy"
                            onclick="openPhotoViewer(${JSON.stringify(photoUrl)})"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                            title="クリックで写真を拡大"
                        >

        // =========================================
        // スポット読み込み
        // =========================================
        async function loadPlaces() {
            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .select("*")
                    .order("id", { ascending: true });

            if (error) {
                console.error("Supabaseエラー:", error);
                alert(
                    "スポット情報を取得できませんでした。\n" +
                    error.message
                );
                return;
            }

            Object.values(layers).forEach(function(layer) {
                layer.clearLayers();
            });

            // 写真をまとめて取得
            let allImages = [];
            const { data: imageData, error: imageError } =
                await supabaseClient
                    .from("spot_images")
                    .select("id, spot_id, image_url, file_path, created_at")
                    .order("created_at", { ascending: true });

            if (imageError) {
                console.error("写真一覧取得エラー:", imageError);
                console.error("Supabaseのspot_images SELECTポリシーを確認してください。");
            } else {
                allImages = imageData || [];
            }

            const imagesBySpot = {};

            allImages.forEach(function(image) {
                if (!imagesBySpot[image.spot_id]) {
                    imagesBySpot[image.spot_id] = [];
                }
                if (getPhotoUrl(image)) {
                    imagesBySpot[image.spot_id].push(image);
                }
            });

            for (const place of data || []) {
                const marker = L.marker(
                    [place.lat, place.lng],
                    {
                        icon: icons[place.category] || defaultIcon
                    }
                );

                // このスポットに登録されている写真
                const images = imagesBySpot[place.id] || [];

                // 以前の形式で保存された写真も表示
                if (place.image_url && images.length === 0) {
                    images.push({
                        image_url: place.image_url,
                        file_path: null
                    });
                }

                let popupHtml = `
                    <div style="width:280px;">
                        <h2 style="margin:0 0 8px;">${escapeHtml(place.name || "")}</h2>

                        ${buildGalleryHtml(images, place.name)}

                        <p>
                            <strong>カテゴリー：</strong>
                            ${escapeHtml(place.category || "")}
                        </p>

                        ${
                            place.subcategory
                                ? `<p><strong>分類：</strong>${escapeHtml(place.subcategory)}</p>`
                                : ""
                        }

                        <hr>

                        <p>
                            <strong>📍 所在地</strong><br>
                            ${escapeHtml(place.address || "")}
                        </p>

                        <p>
                            <strong>🌾 活動内容・利用内容</strong><br>
                            ${escapeHtml(place.activity_history || "")}
                        </p>

                        <p>
                            <strong>📝 メモ</strong><br>
                            ${escapeHtml(place.note || "")}
                        </p>

                        ${
                            place.description
                                ? `<hr><p>${escapeHtml(place.description)}</p>`
                                : ""
                        }
                `;

                if (currentUserIsMember && editMode) {
                    popupHtml += `
                        <div style="margin-top:12px;">
                            <button
                                type="button"
                                onclick="openEditForm(${Number(place.id)})"
                                style="padding:6px 10px;cursor:pointer;margin-right:5px;"
                            >
                                ✏️ 編集
                            </button>
                    `;

                    if (currentUserIsAdmin) {
                        popupHtml += `
                            <button
                                type="button"
                                onclick="deleteSpot(${Number(place.id)})"
                                style="padding:6px 10px;cursor:pointer;"
                            >
                                🗑️ 削除
                            </button>
                        `;
                    }

                    popupHtml += "</div>";
                }

                popupHtml += "</div>";

                marker.bindPopup(popupHtml);

                if (layers[place.category]) {
                    marker.addTo(layers[place.category]);
                } else {
                    marker.addTo(map);
                }
            }
        }

        // =========================================

        // =========================================
        function showAllLayers() {
            Object.values(layers).forEach(function(layer) {
                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }
            });
        }

        function showCategory(category) {
            Object.values(layers).forEach(function(layer) {
                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            });

            if (layers[category]) {
                layers[category].addTo(map);
            }
        }

        // =========================================
        // 編集フォームを開く
        // =========================================

                await supabaseClient

        // =========================================
        // 既存写真の表示
        // =========================================
        function renderExistingEditImages() {
            const container = document.getElementById("existingEditPhotoPreview");
            container.innerHTML = "";

            existingEditImages.forEach(function(image) {
                const item = document.createElement("div");
                item.className = "existing-photo-item";

                const img = document.createElement("img");
                img.src = image.image_url;
                img.alt = "登録済み写真";

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "削除";
                deleteButton.title = "保存時にこの写真を削除します";

                deleteButton.addEventListener("click", function() {
                    const alreadyMarked = imagesToDelete.some(function(item) {
                        return item.id === image.id;
                    });

                    if (alreadyMarked) {
                        return;
                    }

                    imagesToDelete.push(image);
                    item.style.opacity = "0.35";
                    deleteButton.textContent = "削除予定";
                    deleteButton.disabled = true;
                });

                item.appendChild(img);
                item.appendChild(deleteButton);
                container.appendChild(item);
            });
        }

            document.getElementById("editPhotoPreview").innerHTML = "";

        // =========================================
        // 既存写真削除を実行
        // =========================================
        async function deleteMarkedImages() {
            for (const image of imagesToDelete) {
                const { error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("id", image.id);

                if (dbError) {
                    throw dbError;
                }

                if (image.file_path) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove([image.file_path]);

                    if (storageError) {
                        console.error("Storage削除エラー:", storageError);
                    }
                }
            }
        }

        document.getElementById("editSaveButton").addEventListener("click", async function() {
            if (!currentUserIsMember) {
                alert("RECメンバーだけが編集できます。");
                return;
            }

            if (editingSpotId === null) {
                alert("編集するスポットが選択されていません。");
                return;
            }

            const name = document.getElementById("editSpotName").value.trim();
            const category = document.getElementById("editSpotCategory").value;
            const subcategory = document.getElementById("editSpotSubcategory").value.trim();

            if (!name) {

            const { error } =
                await supabaseClient

                    .update({
                        name: name,

                    })

                if (selectedEditImages.length > 0) {

            } catch (imageError) {
                console.error("写真更新エラー:", imageError);

                    "スポットの文章は更新されましたが、写真の一部処理に失敗しました。\n" +

        // =========================================
        // スポット削除（管理者のみ）
        // =========================================
        async function deleteSpot(id) {
            if (!currentUserIsAdmin) {
                alert("スポットを削除できるのは管理者だけです。");
                return;
            }

            const { data: spot, error: spotError } =
                await supabaseClient
                    .from("spots")
                    .select("name")
                    .eq("id", id)
                    .single();

            if (spotError) {
                alert("スポット情報を取得できませんでした。\n" + spotError.message);
                return;
            }

            const answer = confirm(
                "「" + (spot.name || "このスポット") + "」を削除しますか？\n\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            // 写真ファイルを先に削除
            const images = await getSpotImages(id);

            if (images.length > 0) {
                const filePaths = images
                    .map(function(image) { return image.file_path; })
                    .filter(function(path) { return !!path; });

                if (filePaths.length > 0) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove(filePaths);

                    if (storageError) {
                        console.error("写真ファイル削除エラー:", storageError);
                    }
                }

                const { error: imageRowsError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("spot_id", id);

                if (imageRowsError) {
                    console.error("写真情報削除エラー:", imageRowsError);
                }
            }

            const { error } =
                await supabaseClient
                    .from("spots")
                    .delete()
                    .eq("id", id);

            if (error) {
                console.error("スポット削除エラー:", error);
                alert("スポットの削除に失敗しました。\n" + error.message);
                return;
            }

            alert("スポットを削除しました！");
            await loadPlaces();
        }

        window.deleteSpot = deleteSpot;

        // =========================================
        // ログイン確認
        // =========================================
        async function checkLogin() {
            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            currentUserIsMember = false;
            currentUserIsAdmin = false;
            editMode = false;

            editModeButton.textContent = "✏️ 編集モード";
            modeText.textContent = "現在：閲覧モード";

            if (!session) {
                loginButton.style.display = "inline-block";
                logoutButton.style.display = "none";
                userInfo.textContent = "";
                roleInfo.textContent = "";
                controls.style.display = "none";
                adminPanel.style.display = "none";
                return;
            }

            loginButton.style.display = "none";
            logoutButton.style.display = "inline-block";
            userInfo.textContent = "ログイン中：" + (session.user.email || "");

            const { data: isMember, error: memberError } =
                await supabaseClient.rpc("is_rec_member");

            if (memberError) {
                console.error("メンバー確認エラー:", memberError);
                alert("RECメンバー確認に失敗しました。\n" + memberError.message);
                return;
            }

            if (!isMember) {
                roleInfo.textContent = "（RECメンバーではありません）";
                controls.style.display = "none";
                adminPanel.style.display = "none";
                return;
            }

            currentUserIsMember = true;

            const { data: isAdmin, error: adminError } =
                await supabaseClient.rpc("is_rec_admin");

            if (adminError) {
                console.error("管理者確認エラー:", adminError);
                currentUserIsAdmin = false;
            } else {
                currentUserIsAdmin = !!isAdmin;
            }

            roleInfo.textContent =
                currentUserIsAdmin
                    ? "（REC管理者）"
                    : "（RECメンバー）";

            controls.style.display = "block";

            if (currentUserIsAdmin) {
                adminPanel.style.display = "block";
                await loadMembers();
            } else {
                adminPanel.style.display = "none";
            }
        }

        // =========================================
        // 管理者：メンバー一覧
        // =========================================
        async function loadMembers() {
            if (!currentUserIsAdmin) {
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("members")
                    .select("email, role, created_at")
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("メンバー一覧取得エラー:", error);
                memberList.innerHTML =
                    "<p>メンバー一覧を取得できませんでした。<br>" +
                    escapeHtml(error.message) +
                    "</p>";
                return;
            }

            memberList.innerHTML = "";

            if (!data || data.length === 0) {
                memberList.innerHTML = "<p>登録されているメンバーはいません。</p>";
                return;
            }

            const title = document.createElement("strong");
            title.textContent = "現在のメンバー";
            memberList.appendChild(title);

            data.forEach(function(member) {
                const row = document.createElement("div");
                row.className = "member-row";

                const email = document.createElement("span");
                email.className = "member-email";
                email.textContent = member.email;

                const role = document.createElement("span");
                role.className = "member-role";
                role.textContent = member.role === "admin" ? "管理者" : "メンバー";

                row.appendChild(email);
                row.appendChild(role);

                // 管理者の削除ボタンは出さない
                if (member.role !== "admin") {
                    const removeButton = document.createElement("button");
                    removeButton.type = "button";
                    removeButton.textContent = "🚫 許可を取り消す";
                    removeButton.addEventListener("click", function() {
                        removeMember(member.email);
                    });
                    row.appendChild(removeButton);
                }

                memberList.appendChild(row);
            });
        }

        // =========================================
        // 管理者：メンバー追加
        // =========================================
        async function addMember() {
            if (!currentUserIsAdmin) {
                alert("メンバーを追加できるのは管理者だけです。");
                return;
            }

            const email = newMemberEmail.value.trim().toLowerCase();

            if (!email) {
                alert("Googleアカウントのメールアドレスを入力してください。");
                return;
            }

            if (!email.includes("@")) {
                alert("メールアドレスの形式を確認してください。");
                return;
            }

            const { error } =
                await supabaseClient
                    .from("members")
                    .insert({
                        email: email,
                        role: "member"
                    });

            if (error) {
                console.error("メンバー追加エラー:", error);

                if (error.code === "23505") {
                    alert("このGoogleアカウントはすでに登録されています。");
                } else {
                    alert("メンバーの追加に失敗しました。\n" + error.message);
                }

                return;
            }

            alert(
                email +
                " をRECメンバーとして許可しました！\n\n" +
                "この人はGoogleログイン後、マップを編集できるようになります。"
            );

            newMemberEmail.value = "";
            await loadMembers();
        }

        // =========================================
        // 管理者：メンバー削除
        // =========================================
        async function removeMember(email) {
            if (!currentUserIsAdmin) {
                alert("メンバーの許可を取り消せるのは管理者だけです。");
                return;
            }

            const answer = confirm(
                "「" + email + "」の編集権限を取り消しますか？\n\n" +
                "取り消すと、このGoogleアカウントではマップを編集できなくなります。"
            );

            if (!answer) {
                return;
            }

            const { error } =
                await supabaseClient
                    .from("members")
                    .delete()
                    .eq("email", email)
                    .eq("role", "member");

            if (error) {
                console.error("メンバー削除エラー:", error);
                alert("編集権限の取り消しに失敗しました。\n" + error.message);
                return;
            }

            alert(email + " の編集権限を取り消しました。");
            await loadMembers();
        }

        document.getElementById("addMemberButton").addEventListener("click", addMember);
        document.getElementById("reloadMembersButton").addEventListener("click", loadMembers);

        newMemberEmail.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                addMember();
            }
        });

        // =========================================
        // 認証状態が変わったら再確認
        // =========================================
        supabaseClient.auth.onAuthStateChange(function() {
            setTimeout(async function() {
                await checkLogin();
                await loadPlaces();
            }, 0);
        });

        // =========================================
        // 最初の読み込み
        // =========================================
        (async function initialize() {
            await checkLogin();
            await loadPlaces();
        })();
    </script>
</body>
</html>
