<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>佐渡島マップ</title>

    <!-- LeafletのCSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* 地図を表示する場所 */
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>佐渡島マップ</h1>

    <!-- ここに地図が表示される -->
    <div id="map"></div>

    <!-- Leaflet本体 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 佐渡島付近を中心に地図を作る
        const map = L.map('map').setView([38.0, 138.4], 10);

        // OpenStreetMapの地図を読み込む
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // ==============================
        // 佐渡島の場所データ
        // ==============================

        const places = [
    {
        lat: 38.0,
        lng: 138.4,
        name: "活動場所①",
        category: "活動場所",
        description: "RECで農作業などを行う場所です。"
    },

    {
        lat: 38.03,
        lng: 138.35,
        name: "宿泊場所①",
        category: "宿泊",
        description: "佐渡合宿で利用する宿泊場所です。"
    },

    {
        lat: 37.98,
        lng: 138.45,
        name: "観光スポット①",
        category: "観光",
        description: "佐渡の観光スポットです。"
    }
];


// ==============================
// 地図にピンを追加
// ==============================

places.forEach(function(place) {

    const marker = L.marker([
        place.lat,
        place.lng
    ]).addTo(map);

    marker.bindPopup(`
        <h3>${place.name}</h3>
        <p><strong>カテゴリー：</strong>${place.category}</p>
        <p>${place.description}</p>
    `);

});
      
    </script>

</body>
</html>
