<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>佐渡島マップ</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 600px;
            width: 100%;
        }

        .emoji-marker {
            font-size: 30px;
            text-align: center;
            line-height: 40px;
            background: none;
            border: none;
        }

        /* 編集モードのボタン */
        #controls {
            margin: 10px 0;
        }

        #editModeButton {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        #modeText {
            margin-left: 10px;
            font-weight: bold;
        }

        /* ログイン */
        #authArea {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        #authArea button {
            padding: 8px 14px;
            margin-right: 8px;
            cursor: pointer;
        }

        #userInfo {
            font-size: 14px;
        }

        /* スポット追加フォーム */
        #spotForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            max-width: 90%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #spotForm h2 {
            margin-top: 0;
        }

        #spotForm label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        #spotForm input,
        #spotForm select,
        #spotForm textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
        }

        #spotForm textarea {
            height: 80px;
            resize: vertical;
        }

        .photo-preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }

        .photo-help {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        #formButtons {
            margin-top: 15px;
            text-align: right;
        }

        #formButtons button {
            padding: 8px 14px;
            margin-left: 5px;
            cursor: pointer;
        }

        /* スポット編集フォーム */
        #editSpotForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            max-width: 90%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #editSpotForm h2 {
            margin-top: 0;
        }

        #editSpotForm label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        #editSpotForm input,
        #editSpotForm select,
        #editSpotForm textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
        }

        #editSpotForm textarea {
            height: 80px;
            resize: vertical;
        }

        #editFormButtons {
            margin-top: 15px;
            text-align: right;
        }

        #editFormButtons button {
            padding: 8px 14px;
            margin-left: 5px;
            cursor: pointer;
        }

        .spot-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin: 8px 0 12px 0;
        }

        .spot-gallery img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        .photo-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .photo-preview-item {
            position: relative;
        }

        .photo-preview-item img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }

        .photo-preview-item button {
            position: absolute;
            top: 2px;
            right: 2px;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            background: rgba(0,0,0,0.65);
            color: white;
            line-height: 20px;
            padding: 0;
        }
    </style>
</head>

<body>

    <h1>佐渡島マップ</h1>

    <!-- Googleログイン -->
    <div id="authArea">
        <button id="loginButton">🔑 Googleでログイン</button>
        <button id="logoutButton" style="display:none;">ログアウト</button>
        <span id="userInfo"></span><span id="roleInfo" style="margin-left:10px;"></span>
    </div>

    <!-- RECメンバーだけ表示 -->
    <div id="controls" style="display:none;">
        <button id="editModeButton">✏️ 編集モード</button>
        <span id="modeText">現在：閲覧モード</span>
    </div>

    <div id="categoryFilters" style="margin:10px 0;">
        <strong>表示：</strong>
        <button type="button" onclick="showAllLayers()">すべて</button>
        <button type="button" onclick="showCategory('活動場所')">🌾 活動場所</button>
        <button type="button" onclick="showCategory('宿泊地')">🏠 宿泊地</button>
        <button type="button" onclick="showCategory('観光地')">📍 観光地</button>
        <button type="button" onclick="showCategory('飲食店')">🍴 飲食店</button>
        <button type="button" onclick="showCategory('生活用品店')">🛒 生活用品店</button>
    </div>

    <div id="map"></div>

    <!-- =========================================
         スポット追加フォーム
         ========================================= -->
    <div id="spotForm">

        <h2>📍 スポットを追加</h2>

        <label for="spotName">スポット名</label>
        <input type="text"
               id="spotName"
               placeholder="例：REC活動場所①">

        <label for="spotCategory">カテゴリー</label>
        <select id="spotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">スーパーや生活用品店</option>
        </select>

        <label for="spotSubcategory">詳細カテゴリー</label>
        <input type="text"
               id="spotSubcategory"
               placeholder="例：自然風景、博物館など">

        <label for="spotAddress">住所</label>
        <input type="text"
               id="spotAddress"
               placeholder="例：佐渡市〇〇地区">

        <label for="spotActivity">活動内容・利用内容</label>
        <textarea id="spotActivity"
                  placeholder="例：棚田の整備、農作業"></textarea>

        <label for="spotNote">メモ</label>
        <textarea id="spotNote"
                  placeholder="自由にメモを入力"></textarea>

        <label for="spotImage">写真</label>
        <input type="file"
               id="spotImage"
               accept="image/*">
        <div class="photo-help">JPG・PNGなど、5MB以下を推奨</div>

        <div id="formButtons">
            <button type="button" id="cancelButton">キャンセル</button>
            <button type="button" id="saveButton">保存</button>
        </div>
    </div>

    <!-- =========================================
         スポット編集フォーム
         ========================================= -->
    <div id="editSpotForm">

        <h2>✏️ スポットを編集</h2>

        <label for="editSpotName">スポット名</label>
        <input type="text" id="editSpotName">

        <label for="editSpotCategory">カテゴリー</label>
        <select id="editSpotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">スーパーや生活用品店</option>
        </select>

        <label for="editSpotSubcategory">詳細カテゴリー</label>
        <input type="text" id="editSpotSubcategory">

        <label for="editSpotAddress">住所</label>
        <input type="text" id="editSpotAddress">

        <label for="editSpotActivity">活動内容・利用内容</label>
        <textarea id="editSpotActivity"></textarea>

        <label for="editSpotNote">メモ</label>
        <textarea id="editSpotNote"></textarea>

        <label for="editSpotImage">写真を変更</label>
        <input type="file"
               id="editSpotImage"
               accept="image/*">
        <div class="photo-help">新しい写真を選択した場合のみ変更されます</div>
        <div id="editPhotoPreview"></div>

        <div id="editFormButtons">
            <button type="button" id="editCancelButton">キャンセル</button>
            <button type="button" id="editSaveButton">保存</button>
        </div>
    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =========================================
        // Supabaseの設定
        // =========================================

        const SUPABASE_URL =
            "https://cskyusrujmxhczcgkdke.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_T-lOBrjyPzfkPUI8mLbHVA_FIRyAp5X";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =========================================
        // Leafletの地図を作成
        // =========================================

        const map =
            L.map('map').setView([38.0, 138.4], 10);


        // OpenStreetMap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =========================================
        // カテゴリーごとのレイヤー
        // =========================================

        const layers = {
            "活動場所": L.layerGroup(),
            "宿泊地": L.layerGroup(),
            "観光地": L.layerGroup(),
            "飲食店": L.layerGroup(),
            "生活用品店": L.layerGroup()
        };


        // =========================================
        // マーカーのアイコン
        // =========================================

        const icons = {

            "活動場所": L.divIcon({
                html: "🌾",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),

            "宿泊地": L.divIcon({
                html: "🏠",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),

            "観光地": L.divIcon({
                html: "📍",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),

            "飲食店": L.divIcon({
                html: "🍴",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),

            "生活用品店": L.divIcon({
                html: "🛒",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            })
        };


        // カテゴリーが見つからない場合
        const defaultIcon = L.divIcon({
            html: "📍",
            className: "emoji-marker",
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });


        // =========================================
        // 編集関連の変数
        // =========================================

        let editMode = false;
        let editingSpotId = null;

        // RECメンバーかどうか
        let currentUserIsMember = false;
        let currentUserIsAdmin = false;


        // =========================================
        // Supabaseからスポットを取得
        // =========================================

        async function loadPlaces() {

            const { data, error } =
                await supabaseClient
                    .from('spots')
                    .select('*');

            if (error) {

                console.error(
                    "Supabaseエラー:",
                    error
                );

                alert(
                    "スポット情報を取得できませんでした。\n" +
                    error.message
                );

                return;
            }

            console.log(
                "Supabaseから取得したデータ:",
                data
            );


            // 既存のマーカーを消す
            Object.values(layers).forEach(
                function(layer) {
                    layer.clearLayers();
                }
            );


            data.forEach(function(place) {

                // マーカーを作成
                const marker = L.marker(
                    [place.lat, place.lng],
                    {
                        icon:
                            icons[place.category] ||
                            defaultIcon
                    }
                );


                // =====================================
                // ポップアップ
                // =====================================

                let popupHtml = `
                    <div style="width:260px;">

                        <h2>${place.name || ""}</h2>

                        ${
                            place.image_url
                            ?
                            `<img
                                src="${place.image_url}"
                                alt="${place.name || "スポット写真"}"
                                class="photo-preview"
                            >`
                            :
                            ""
                        }

                        <p>
                            <strong>カテゴリー：</strong>
                            ${place.category || ""}
                        </p>

                        ${
                            place.subcategory
                            ?
                            `<p>
                                <strong>分類：</strong>
                                ${place.subcategory}
                            </p>`
                            :
                            ""
                        }

                        <hr>

                        <p>
                            <strong>📍 所在地</strong><br>
                            ${place.address || ""}
                        </p>

                        <p>
                            <strong>🌾 活動内容</strong><br>
                            ${place.activity_history || ""}
                        </p>

                        <p>
                            <strong>📝 メモ</strong><br>
                            ${place.note || ""}
                        </p>

                        <hr>

                        <p>
                            ${place.description || ""}
                        </p>
                `;


                // 編集モード中のRECメンバーだけ編集ボタンを表示
                if (currentUserIsMember && editMode) {

                    popupHtml += `
                        <div style="margin-top:10px;">
                            <button
                                onclick="openEditForm(${place.id})"
                                style="
                                    padding:6px 10px;
                                    cursor:pointer;
                                    margin-right:5px;
                                "
                            >
                                ✏️ 編集
                            </button>
                    `;

                    // 管理者だけ削除ボタンを表示
                    if (currentUserIsAdmin) {
                        popupHtml += `
                            <button
                                onclick="deleteSpot(${place.id}, '${String(place.name || "").replace(/'/g, "\\'")}')"
                                style="
                                    padding:6px 10px;
                                    cursor:pointer;
                                "
                            >
                                🗑️ 削除
                            </button>
                        `;
                    }

                    popupHtml += `
                        </div>
                    `;
                }


                popupHtml += `
                    </div>
                `;


                marker.bindPopup(popupHtml);


                // =====================================
                // カテゴリーに対応するレイヤーへ追加
                // =====================================

                if (layers[place.category]) {

                    marker.addTo(
                        layers[place.category]
                    );

                } else {

                    marker.addTo(map);
                }

            });


            // =====================================
            // レイヤーを地図に追加
            // =====================================

            Object.values(layers).forEach(
                function(layer) {
                    layer.addTo(map);
                }
            );
        }


        // =========================================
        // カテゴリー表示切り替え
        // =========================================

        function showAllLayers() {

            Object.values(layers).forEach(
                function(layer) {
                    if (!map.hasLayer(layer)) {
                        layer.addTo(map);
                    }
                }
            );
        }

        function showCategory(category) {

            Object.values(layers).forEach(
                function(layer) {
                    if (map.hasLayer(layer)) {
                        map.removeLayer(layer);
                    }
                }
            );

            if (layers[category]) {
                layers[category].addTo(map);
            }
        }

        window.showAllLayers = showAllLayers;
        window.showCategory = showCategory;


        // =========================================
        // 編集モード
        // =========================================

        const editModeButton =
            document.getElementById(
                "editModeButton"
            );

        const modeText =
            document.getElementById(
                "modeText"
            );


        editModeButton.addEventListener(
            "click",
            function() {

                editMode = !editMode;

                if (editMode) {

                    editModeButton.textContent =
                        "👀 閲覧モードに戻す";

                    modeText.textContent =
                        "現在：編集モード";

                } else {

                    editModeButton.textContent =
                        "✏️ 編集モード";

                    modeText.textContent =
                        "現在：閲覧モード";
                }

                // ポップアップ内の編集・削除ボタン表示を更新
                loadPlaces();
            }
        );


        // =========================================
        // スポット追加用の変数
        // =========================================

        let newSpotLat = null;
        let newSpotLng = null;

        let temporaryMarker = null;

        // 選択中の写真
        let selectedSpotImages = [];
        let selectedEditImages = [];


        // =========================================
        // 写真選択・プレビュー
        // =========================================

        function renderPhotoPreview(files, previewId, selectedArray) {

            const preview = document.getElementById(previewId);
            preview.innerHTML = "";

            files.forEach(function(file, index) {

                const reader = new FileReader();

                reader.onload = function(e) {

                    const item = document.createElement("div");
                    item.className = "photo-preview-item";

                    item.innerHTML = `
                        <img src="${e.target.result}" alt="選択した写真">
                        <button type="button" title="この写真を外す">×</button>
                    `;

                    item.querySelector("button").addEventListener(
                        "click",
                        function() {
                            selectedArray.splice(index, 1);
                            renderPhotoPreview(
                                selectedArray,
                                previewId,
                                selectedArray
                            );
                        }
                    );

                    preview.appendChild(item);
                };

                reader.readAsDataURL(file);
            });
        }


        function handlePhotoSelection(inputId, previewId, selectedArray) {

            const input = document.getElementById(inputId);

            input.addEventListener("change", function() {

                Array.from(input.files).forEach(function(file) {

                    if (!file.type.startsWith("image/")) {
                        alert("画像ファイルだけ選択してください");
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        alert(file.name + " は5MBを超えています");
                        return;
                    }

                    selectedArray.push(file);
                });

                input.value = "";

                renderPhotoPreview(
                    selectedArray,
                    previewId,
                    selectedArray
                );
            });
        }


        handlePhotoSelection(
            "spotImages",
            "spotPhotoPreview",
            selectedSpotImages
        );

        handlePhotoSelection(
            "editSpotImages",
            "editPhotoPreview",
            selectedEditImages
        );


        // =========================================
        // Supabase Storageへ写真をアップロード
        // =========================================

        async function uploadSpotImages(spotId, files) {

            const uploadedImages = [];

            for (const file of files) {

                const extension =
                    file.name.split(".").pop();

                const fileName =
                    spotId +
                    "/" +
                    crypto.randomUUID() +
                    "." +
                    extension;

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("spot-images")
                        .upload(
                            fileName,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: false
                            }
                        );

                if (uploadError) {
                    throw uploadError;
                }

                const { data: publicUrlData } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(fileName);

                const imageUrl =
                    publicUrlData.publicUrl;

                const { error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .insert({
                            spot_id: spotId,
                            image_url: imageUrl,
                            file_path: fileName
                        });

                if (dbError) {
                    throw dbError;
                }

                uploadedImages.push({
                    image_url: imageUrl,
                    file_path: fileName
                });
            }

            return uploadedImages;
        }


        // =========================================
        // 地図をクリック
        // =========================================

        map.on(
            "click",
            function(e) {

                // 閲覧モードなら何もしない
                if (!editMode) {
                    return;
                }

                // クリックした場所の座標
                newSpotLat = e.latlng.lat;
                newSpotLng = e.latlng.lng;


                console.log(
                    "新しいスポットの場所:",
                    newSpotLat,
                    newSpotLng
                );


                // すでに仮マーカーがあれば削除
                if (temporaryMarker) {

                    map.removeLayer(
                        temporaryMarker
                    );
                }


                // 新しい仮マーカー
                temporaryMarker =
                    L.marker(
                        [newSpotLat, newSpotLng]
                    ).addTo(map);


                temporaryMarker
                    .bindPopup(
                        "ここにスポットを追加します"
                    )
                    .openPopup();


                // 入力フォームを表示
                document.getElementById(
                    "spotForm"
                ).style.display = "block";
            }
        );


        // =========================================
        // スポット追加：キャンセル
        // =========================================

        document.getElementById(
            "cancelButton"
        ).addEventListener(
            "click",
            function() {

                document.getElementById(
                    "spotForm"
                ).style.display = "none";


                if (temporaryMarker) {

                    map.removeLayer(
                        temporaryMarker
                    );

                    temporaryMarker = null;
                }


                newSpotLat = null;
                newSpotLng = null;
            }
        );


        // =========================================
        // スポット追加：保存
        // =========================================

        document.getElementById(
            "saveButton"
        ).addEventListener(
            "click",
            async function() {

                const name =
                    document.getElementById(
                        "spotName"
                    ).value;

                const category =
                    document.getElementById(
                        "spotCategory"
                    ).value;

                const subcategory =
                    document.getElementById(
                        "spotSubcategory"
                    ).value;

                const address =
                    document.getElementById(
                        "spotAddress"
                    ).value;

                const activity =
                    document.getElementById(
                        "spotActivity"
                    ).value;

                const note =
                    document.getElementById(
                        "spotNote"
                    ).value;


                if (!name) {

                    alert(
                        "スポット名を入力してください"
                    );

                    return;
                }


                if (
                    newSpotLat === null ||
                    newSpotLng === null
                ) {

                    alert(
                        "地図上の場所を選択してください"
                    );

                    return;
                }


                const imageFile =
                    document.getElementById(
                        "spotImage"
                    ).files[0];

                // Supabaseに登録
                const { data, error } =
                    await supabaseClient
                        .from("spots")
                        .insert([
                            {
                                name: name,
                                lat: newSpotLat,
                                lng: newSpotLng,
                                category: category,
                                subcategory: subcategory,
                                address: address,
                                activity_history: activity,
                                note: note
                            }
                        ])
                        .select();


                if (error) {

                    console.error(
                        "保存エラー:",
                        error
                    );

                    alert(
                        "保存に失敗しました。\n" +
                        error.message
                    );

                    return;
                }


                console.log(
                    "保存されたデータ:",
                    data
                );

                const newSpot = data && data[0];

                // 写真が選択されている場合はStorageへアップロード
                if (imageFile && newSpot) {

                    if (!imageFile.type.startsWith("image/")) {
                        alert("写真ファイルを選択してください");
                        return;
                    }

                    if (imageFile.size > 5 * 1024 * 1024) {
                        alert("写真は5MB以下にしてください");
                        return;
                    }

                    const extension =
                        imageFile.name
                            .split(".")
                            .pop()
                            .toLowerCase();

                    const filePath =
                        "spot-" +
                        newSpot.id +
                        "-" +
                        Date.now() +
                        "." +
                        extension;

                    const {
                        error: uploadError
                    } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .upload(
                                filePath,
                                imageFile,
                                {
                                    cacheControl: "3600",
                                    upsert: false
                                }
                            );

                    if (uploadError) {

                        console.error(
                            "写真アップロードエラー:",
                            uploadError
                        );

                        alert(
                            "スポットは登録されましたが、写真の保存に失敗しました。\n" +
                            uploadError.message
                        );

                    } else {

                        const {
                            data: publicUrlData
                        } =
                            supabaseClient.storage
                                .from("spot-images")
                                .getPublicUrl(
                                    filePath
                                );

                        const imageUrl =
                            publicUrlData.publicUrl;

                        const {
                            error: imageUrlError
                        } =
                            await supabaseClient
                                .from("spots")
                                .update({
                                    image_url: imageUrl
                                })
                                .eq(
                                    "id",
                                    newSpot.id
                                );

                        if (imageUrlError) {

                            console.error(
                                "写真URL保存エラー:",
                                imageUrlError
                            );

                            alert(
                                "スポットは登録されましたが、写真URLの保存に失敗しました。"
                            );
                        }
                    }
                }

                alert(
                    "スポットを保存しました！"
                );


                document.getElementById(
                    "spotForm"
                ).style.display = "none";


                if (temporaryMarker) {

                    map.removeLayer(
                        temporaryMarker
                    );

                    temporaryMarker = null;
                }


                newSpotLat = null;
                newSpotLng = null;


                // 入力フォームを空にする
                document.getElementById(
                    "spotName"
                ).value = "";

                document.getElementById(
                    "spotSubcategory"
                ).value = "";

                document.getElementById(
                    "spotAddress"
                ).value = "";

                document.getElementById(
                    "spotActivity"
                ).value = "";

                document.getElementById(
                    "spotNote"
                ).value = "";


                // 最新のデータを読み込む
                await loadPlaces();
            }
        );


        // =========================================
        // 編集フォームを開く
        // =========================================

        async function openEditForm(id) {

            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .select("*")
                    .eq("id", id)
                    .single();


            if (error) {

                console.error(
                    "スポット取得エラー:",
                    error
                );

                alert(
                    "スポット情報を取得できませんでした"
                );

                return;
            }


            editingSpotId = id;


            // 現在の情報をフォームに入れる
            document.getElementById(
                "editSpotName"
            ).value = data.name || "";

            document.getElementById(
                "editSpotCategory"
            ).value =
                data.category || "活動場所";

            document.getElementById(
                "editSpotSubcategory"
            ).value =
                data.subcategory || "";

            document.getElementById(
                "editSpotAddress"
            ).value =
                data.address || "";

            document.getElementById(
                "editSpotActivity"
            ).value =
                data.activity_history || "";

            document.getElementById(
                "editSpotNote"
            ).value =
                data.note || "";

            document.getElementById(
                "editSpotImage"
            ).value = "";

            const editPhotoPreview =
                document.getElementById(
                    "editPhotoPreview"
                );

            if (data.image_url) {
                editPhotoPreview.innerHTML =
                    `<img
                        src="${data.image_url}"
                        alt="現在のスポット写真"
                        class="photo-preview"
                    >`;
            } else {
                editPhotoPreview.innerHTML =
                    "<p>現在、写真は登録されていません。</p>";
            }


            // 編集フォームを表示
            document.getElementById(
                "editSpotForm"
            ).style.display = "block";
        }


        // inline onclickから呼び出せるようにする
        window.openEditForm = openEditForm;


        // =========================================
        // 編集：キャンセル
        // =========================================

        document.getElementById(
            "editCancelButton"
        ).addEventListener(
            "click",
            function() {

                document.getElementById(
                    "editSpotForm"
                ).style.display = "none";

                selectedEditImages = [];

                document.getElementById(
                    "editPhotoPreview"
                ).innerHTML = "";

                editingSpotId = null;
            }
        );


        // =========================================
        // 編集：保存
        // =========================================

        document.getElementById(
            "editSaveButton"
        ).addEventListener(
            "click",
            async function() {

                if (editingSpotId === null) {

                    alert(
                        "編集するスポットが選択されていません"
                    );

                    return;
                }


                const name =
                    document.getElementById(
                        "editSpotName"
                    ).value;

                const category =
                    document.getElementById(
                        "editSpotCategory"
                    ).value;

                const subcategory =
                    document.getElementById(
                        "editSpotSubcategory"
                    ).value;

                const address =
                    document.getElementById(
                        "editSpotAddress"
                    ).value;

                const activity =
                    document.getElementById(
                        "editSpotActivity"
                    ).value;

                const note =
                    document.getElementById(
                        "editSpotNote"
                    ).value;

                const imageFile =
                    document.getElementById(
                        "editSpotImage"
                    ).files[0];


                if (!name) {

                    alert(
                        "スポット名を入力してください"
                    );

                    return;
                }


                // Supabaseのデータを更新
                const { data, error } =
                    await supabaseClient
                        .from("spots")
                        .update({
                            name: name,
                            category: category,
                            subcategory: subcategory,
                            address: address,
                            activity_history: activity,
                            note: note
                        })
                        .eq(
                            "id",
                            editingSpotId
                        )
                        .select();


                if (error) {

                    console.error(
                        "更新エラー:",
                        error
                    );

                    alert(
                        "保存に失敗しました。\n" +
                        error.message
                    );

                    return;
                }


                console.log(
                    "更新されたデータ:",
                    data
                );

                // 新しい写真が選択されていればアップロード
                if (imageFile) {

                    if (!imageFile.type.startsWith("image/")) {
                        alert("写真ファイルを選択してください");
                        return;
                    }

                    if (imageFile.size > 5 * 1024 * 1024) {
                        alert("写真は5MB以下にしてください");
                        return;
                    }

                    const extension =
                        imageFile.name
                            .split(".")
                            .pop()
                            .toLowerCase();

                    const filePath =
                        "spot-" +
                        editingSpotId +
                        "-" +
                        Date.now() +
                        "." +
                        extension;

                    const {
                        error: uploadError
                    } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .upload(
                                filePath,
                                imageFile,
                                {
                                    cacheControl: "3600",
                                    upsert: false
                                }
                            );

                    if (uploadError) {

                        console.error(
                            "写真アップロードエラー:",
                            uploadError
                        );

                        alert(
                            "文章は更新されましたが、写真の保存に失敗しました。\n" +
                            uploadError.message
                        );

                    } else {

                        const {
                            data: publicUrlData
                        } =
                            supabaseClient.storage
                                .from("spot-images")
                                .getPublicUrl(
                                    filePath
                                );

                        const imageUrl =
                            publicUrlData.publicUrl;

                        const {
                            error: imageUrlError
                        } =
                            await supabaseClient
                                .from("spots")
                                .update({
                                    image_url: imageUrl
                                })
                                .eq(
                                    "id",
                                    editingSpotId
                                );

                        if (imageUrlError) {

                            console.error(
                                "写真URL更新エラー:",
                                imageUrlError
                            );

                            alert(
                                "文章は更新されましたが、写真URLの更新に失敗しました。"
                            );
                        }
                    }
                }

                alert(
                    "スポットを更新しました！"
                );


                document.getElementById(
                    "editSpotForm"
                ).style.display = "none";

                selectedEditImages = [];

                document.getElementById(
                    "editPhotoPreview"
                ).innerHTML = "";

                editingSpotId = null;


                // 最新のデータを読み込む
                await loadPlaces();
            }
        );


        // =========================================
        // スポット削除（管理者のみ）
        // =========================================

        async function deleteSpot(id, name) {

            if (!currentUserIsAdmin) {
                alert("削除できるのは管理者だけです");
                return;
            }

            const answer = confirm(
                "「" + name + "」を削除しますか？\n\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            const { error } =
                await supabaseClient
                    .from("spots")
                    .delete()
                    .eq("id", id);

            if (error) {

                console.error(
                    "削除エラー:",
                    error
                );

                alert(
                    "削除に失敗しました。\n" +
                    error.message
                );

                return;
            }

            alert("スポットを削除しました！");

            await loadPlaces();
        }

        window.deleteSpot = deleteSpot;


        // =========================================
        // Googleログイン
        // =========================================

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const userInfo =
            document.getElementById(
                "userInfo"
            );


        loginButton.addEventListener(
            "click",
            async function() {

                const { data, error } =
                    await supabaseClient.auth
                        .signInWithOAuth({
                            provider: "google",
                            options: {
                                redirectTo:
                                    "https://ytrnht1222-cmd.github.io/sado_map/"
                            }
                        });


                if (error) {

                    console.error(
                        "ログインエラー:",
                        error
                    );

                    alert(
                        "ログインに失敗しました。\n" +
                        error.message
                    );
                }
            }
        );


        // =========================================
        // ログアウト
        // =========================================

        logoutButton.addEventListener(
            "click",
            async function() {

                const { error } =
                    await supabaseClient.auth.signOut();


                if (error) {

                    console.error(
                        "ログアウトエラー:",
                        error
                    );

                    return;
                }


                location.reload();
            }
        );


        // =========================================
        // 現在ログインしているユーザーを確認
        // =========================================

        async function checkLogin() {

            const {
                data: { session }
            } =
                await supabaseClient.auth
                    .getSession();


            if (session) {

                // Googleログイン済み
                loginButton.style.display =
                    "none";

                logoutButton.style.display =
                    "inline-block";

                userInfo.textContent =
                    "ログイン中：" +
                    session.user.email;


                console.log(
                    "ログインユーザー:",
                    session.user
                );


                // RECメンバーか確認
                const {
                    data: isMember,
                    error
                } =
                    await supabaseClient.rpc(
                        "is_rec_member"
                    );


                console.log(
                    "RECメンバー判定:",
                    isMember
                );

                console.log(
                    "判定エラー:",
                    error
                );


                if (error) {

                    console.error(
                        "メンバー確認エラー:",
                        error
                    );

                    alert(
                        "メンバー確認に失敗しました"
                    );

                    return;
                }


                if (isMember) {

                    console.log(
                        "RECメンバーです！"
                    );

                    currentUserIsMember = true;

                    // 管理者かどうかも確認
                    const {
                        data: isAdmin,
                        error: adminError
                    } =
                        await supabaseClient.rpc(
                            "is_rec_admin"
                        );

                    console.log(
                        "管理者判定:",
                        isAdmin
                    );

                    console.log(
                        "管理者判定エラー:",
                        adminError
                    );

                    if (adminError) {
                        console.error(
                            "管理者確認エラー:",
                            adminError
                        );
                        currentUserIsAdmin = false;
                    } else {
                        currentUserIsAdmin = !!isAdmin;
                    }

                    document.getElementById(
                        "controls"
                    ).style.display = "block";

                    document.getElementById(
                        "roleInfo"
                    ).textContent =
                        currentUserIsAdmin
                        ? "（REC管理者）"
                        : "（RECメンバー）";

                } else {

                    console.log(
                        "RECメンバーではありません"
                    );

                    currentUserIsMember = false;

                    document.getElementById(
                        "controls"
                    ).style.display = "none";
                }


            } else {

                // ログアウト状態
                loginButton.style.display =
                    "inline-block";

                logoutButton.style.display =
                    "none";

                userInfo.textContent = "";
                document.getElementById(
                    "roleInfo"
                ).textContent = "";

                currentUserIsMember = false;
                currentUserIsAdmin = false;

                document.getElementById(
                    "controls"
                ).style.display = "none";


                console.log(
                    "現在ログインしていません"
                );
            }
        }


        // =========================================
        // 最初にログイン確認
        // その後、スポットを読み込む
        // =========================================

        checkLogin().then(
            function() {
                loadPlaces();
            }
        );

    </script>

</body>
</html>
