<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>佐渡島マップ</title>

    <!-- LeafletのCSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* 地図を表示する場所 */
        #map {
            height: 600px;
            width: 100%;
        }

         /* 絵文字マーカー */
    .emoji-marker {
        font-size: 30px;
        text-align: center;
        line-height: 40px;
        background: none;
        border: none;
    }
    </style>
</head>

<body>

    <h1>佐渡島マップ</h1>

    <!-- ここに地図が表示される -->
    <div id="map"></div>

    <!-- Leaflet本体 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 場所のデータ -->
    <script src="places.js"></script>
    
    <script>
        // 佐渡島付近を中心に地図を作る
        const map = L.map('map').setView([38.0, 138.4], 10);

        // OpenStreetMapの地図を読み込む
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        


// ==============================
// カテゴリーごとのレイヤーを作る
// ==============================

const layers = {
    "活動場所": L.layerGroup(),
    "宿泊": L.layerGroup(),
    "観光": L.layerGroup(),
    "飲食店": L.layerGroup()
};


// ==============================
// カテゴリーごとのマーカーアイコン
// ==============================

const icons = {

    "活動場所": L.divIcon({
        html: "🌾",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "宿泊": L.divIcon({
        html: "🏠",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "観光": L.divIcon({
        html: "📍",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    }),

    "飲食店": L.divIcon({
        html: "🍴",
        className: "emoji-marker",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    })

};


// ==============================
// 場所データからマーカーを作る
// ==============================

places.forEach(function(place) {

    const marker = L.marker(
        [place.lat, place.lng],
        {
            icon: icons[place.category]
        }
    );


    // ==============================
    // ポップアップ
    // ==============================

    marker.bindPopup(`
        <div style="width: 220px;">

            <h3>${place.name}</h3>

            <p>
                <strong>カテゴリー：</strong>
                ${place.category}
            </p>

            <p>
                ${place.description}
            </p>

        </div>
    `);


    // ==============================
    // カテゴリーごとのレイヤーに追加
    // ==============================

    if (layers[place.category]) {
        marker.addTo(layers[place.category]);
    }

});


// ==============================
// 最初は全部表示
// ==============================

Object.values(layers).forEach(function(layer) {
    layer.addTo(map);
});


// ==============================
// 右上にカテゴリー選択メニューを表示
// ==============================

const overlayMaps = {
    "🌾 活動場所": layers["活動場所"],
    "🏠 宿泊": layers["宿泊"],
    "📍 観光": layers["観光"],
    "🍴 飲食店": layers["飲食店"]
};

L.control.layers(null, overlayMaps).addTo(map);        

      
    </script>

</body>
</html>
